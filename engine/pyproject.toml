[project]
name = "codepreflight-engine"
version = "0.1.0"
description = "Local repository and review engine for CodePreFlight"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.0",
  "pathspec>=1.0.0",
  "pydantic>=2.11.0",
  "tomli-w>=1.2.0",
]

[project.scripts]
codepreflight-engine = "codepreflight_engine.main:main"

[dependency-groups]
dev = [
  "mypy>=1.17.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codepreflight_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["codepreflight_engine"]
